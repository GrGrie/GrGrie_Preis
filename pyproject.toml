[project]
name = "grgriepreis"
version = "0.2.0"
description = "Discounter website scraper and product detector"
authors = [
    {name = "GrGrie",email = "gsgrechkin@gmail.com"}
]
license = {text = "GrGrie"}
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.9.1+cpu",
    "torchvision==0.24.1+cpu",
    "onnxruntime==1.23.2",
    "ultralytics==8.3.231",
    "fastapi",
    "uvicorn",
    "selenium",
    "webdriver-manager",
    "fitz",
    "PyMuPDF",
    "python-multipart",
    "jinja2",
    "opencv-python-headless==4.11.0.86",
    "pillow",
    "numpy==1.26.4",
    "paddlepaddle==2.6.2",
    "paddleocr==2.9.1",
    "python-telegram-bot",
    "python-dotenv",
    "requests",
    "pyyaml"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]

